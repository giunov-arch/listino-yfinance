name: snapshot

on:
  schedule:
    - cron: '17 18 * * 1-5'   # 18:17 UTC, weekdays only — after Milan close;
                               # avoid :00 exactly, GitHub queues scheduled
                               # jobs and delays spike right on the hour
  workflow_dispatch:           # lets you trigger a run manually from the
                               # Actions tab, e.g. for the first test run

permissions:
  contents: write             # needed so the job can commit the snapshot back

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python collector.py
      - run: |
          git config user.name "listino-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dati/snapshot.json
          git diff --staged --quiet || git commit -m "snapshot $(date -u +%F)"
          git push
